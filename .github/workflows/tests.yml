name: tests

on: [push, pull_request]

env:
  PYTHONHASHSEED: 1042466059
  ZOPE_INTERFACE_STRICT_IRO: 1


jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      matrix:
        python-version:
          - "pypy-3.11"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15-dev"
        os:
          - "ubuntu-latest"
        extras:
          - "[test,docs,zodb,test-zodb]"
        include:
          - os: macos-latest
            python-version: "3.14"
            extras: "[test,docs,zodb,test-zodb]"

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'setup.py'
    - name: Install dependencies
      run: |
        python -m pip install -U pip setuptools wheel
        python -m pip install -U coverage
        python -m pip install -U -e ".${{ matrix.extras }}"
    - name: Install PostgreSQL (mac)
      if: matrix.os == 'macos-latest'
      run: |

        brew install postgresql@17

        # Homebrew installs PostgreSQL binaries to specific directories based on architecture
        if [ "$(uname -m)" = "arm64" ]; then
            echo "/opt/homebrew/opt/postgresql@17/bin" >> $GITHUB_PATH
        else
            echo "/usr/local/opt/postgresql@17/bin" >> $GITHUB_PATH
        fi
    - name: Test
      run: |
        coverage run -m zope.testrunner --test-path=src  --auto-color --auto-progress
        coverage run -a -m sphinx -b doctest -d docs/_build/doctrees docs docs/_build/doctests
        coverage combine || true
        coverage report -i || true
    - name: Lint
      if: matrix.python-version == '3.14'
      run: |
        python -m pip install -U pylint
        pylint src
    - name: Test No ZODB
      run: |
        python -m pip uninstall -y ZODB zope.site persistent
        python -m zope.testrunner --test-path=src  --auto-color --auto-progress
    - name: Submit to Coveralls
      if: matrix.os != 'macos-latest'
      # This is a container action, which only runs on Linux.
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel: true

  coveralls_finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true
